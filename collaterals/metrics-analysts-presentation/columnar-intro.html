<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Elastic Metrics — From 25 to 3.75 Bytes</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&family=JetBrains+Mono:wght@400;700;900&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    html { width: 100%; height: 100%; overflow: hidden; background: #22242C; }
    body {
      width: 1280px; height: 720px; overflow: hidden;
      position: absolute;
      font-family: 'Inter', -apple-system, sans-serif;
      -webkit-font-smoothing: antialiased;
      background: #22242C;
      display: flex; flex-direction: column;
      align-items: center; justify-content: center;
    }

    body::before {
      content: ''; position: fixed; inset: 0;
      background-image: radial-gradient(circle, rgba(255,255,255,0.035) 1px, transparent 1px);
      background-size: 28px 28px;
      pointer-events: none; z-index: 0;
    }

    .accent-bar {
      position: fixed; top: 0; left: 0;
      width: 4px; height: 100%;
      background: #00BFB3; z-index: 20;
    }

    @keyframes fade-up {
      from { opacity: 0; transform: translateY(14px); }
      to   { opacity: 1; transform: translateY(0); }
    }

    .stage {
      position: relative; z-index: 10;
      display: flex; flex-direction: column;
      align-items: center;
      text-align: center;
    }

    .eyebrow {
      font-size: 0.72rem; font-weight: 700; letter-spacing: 0.22em;
      text-transform: uppercase; color: #00BFB3;
      margin-bottom: 34px;
      opacity: 0; animation: fade-up 0.6s ease forwards 0.15s;
    }

    /* ── Giant number ── */
    .big-number {
      display: flex; align-items: baseline; justify-content: center; gap: 18px;
      opacity: 0; animation: fade-up 0.7s ease forwards 0.35s;
      margin-bottom: 10px;
    }

    .num {
      font-family: 'JetBrains Mono', monospace;
      font-size: 11.5rem;
      font-weight: 900;
      letter-spacing: -0.05em;
      line-height: 0.9;
      color: #fff;
      font-variant-numeric: tabular-nums;
      transition: color 0.4s ease, text-shadow 0.4s ease;
    }
    .num.settled {
      color: #00BFB3;
      text-shadow: 0 0 60px rgba(0,191,179,0.45);
    }

    .unit {
      font-size: 1.5rem; font-weight: 300;
      color: rgba(255,255,255,0.45);
      letter-spacing: -0.01em;
    }
    .unit strong { font-weight: 700; color: rgba(255,255,255,0.85); }

    /* ── Byte blocks ── */
    .blocks {
      display: flex; gap: 7px;
      margin: 38px 0 44px;
      opacity: 0; animation: fade-up 0.6s ease forwards 0.55s;
    }
    .blk {
      width: 34px; height: 34px;
      border-radius: 6px;
      background: rgba(255,255,255,0.14);
      border: 1px solid rgba(255,255,255,0.18);
      transition: opacity 0.5s ease, transform 0.5s ease,
                  background 0.5s ease, border-color 0.5s ease, box-shadow 0.5s ease;
      position: relative; overflow: hidden;
    }
    .blk.gone {
      opacity: 0.06;
      transform: scale(0.55);
      background: transparent;
    }
    .blk.kept {
      background: rgba(0,191,179,0.75);
      border-color: #00BFB3;
      box-shadow: 0 0 18px rgba(0,191,179,0.5);
    }
    /* partial block: only 75% filled */
    .blk.partial::after {
      content: '';
      position: absolute; inset: 0;
      left: 75%;
      background: #22242C;
      opacity: 0.85;
    }

    /* ── Tagline ── */
    .tagline {
      font-size: 1.7rem; font-weight: 300;
      color: rgba(255,255,255,0.4);
      letter-spacing: -0.015em;
      opacity: 0; transition: opacity 0.8s ease, transform 0.8s ease;
      transform: translateY(10px);
    }
    .tagline.show { opacity: 1; transform: translateY(0); }
    .tagline strong { font-weight: 700; color: #fff; }

    /* ── Auto-advance progress ── */
    .progress {
      position: fixed; bottom: 0; left: 0;
      height: 2px; width: 0%;
      background: linear-gradient(to right, rgba(0,191,179,0.3), #00BFB3);
      z-index: 30;
    }
    .progress.run {
      transition: width 3.2s linear;
      width: 100%;
    }
  
    /* ── Standard footer ── */
    .std-footer { position: fixed; left: 4.5vw; right: 4.5vw; bottom: 0; height: 56px; display: flex; align-items: center; gap: 1.1rem; border-top: 1px solid rgba(255,255,255,0.06); z-index: 30; }
    .elastic-logo-svg { height: 26px; width: auto; display: block; }
    .std-footer-div { width: 1px; height: 20px; background: rgba(255,255,255,0.1); }
    .std-footer-tag { font-size: 0.7rem; color: rgba(255,255,255,0.28); letter-spacing: 0.02em; font-family: 'Inter', -apple-system, sans-serif; }
  </style>
</head>
<body>

  <div class="accent-bar"></div>

  <div class="stage">
    <div class="eyebrow">Columnar Engine · Architecture Shift</div>

    <div class="big-number">
      <span class="num" id="num">25</span>
      <span class="unit"><strong>bytes</strong><br>per data point</span>
    </div>

    <div class="blocks" id="blocks"></div>

    <p class="tagline" id="tagline">Here is <strong>how we did it.</strong></p>
  </div>

  <div class="progress" id="progress"></div>

  <script>
  (function scaleToFit() {
    if (window !== window.top) return;
    const W = 1280, H = 720;
    function fit() {
      var s = Math.min(window.innerWidth / W, window.innerHeight / H);
      document.body.style.transform = 'scale(' + s + ')';
      document.body.style.transformOrigin = '0 0';
      document.body.style.left = Math.round((window.innerWidth  - W * s) / 2) + 'px';
      document.body.style.top  = Math.round((window.innerHeight - H * s) / 2) + 'px';
    }
    fit(); window.addEventListener('resize', fit);
  })();
  </script>
  <script src="/js/fuckslides.js"></script>

  <script>
  (function () {
    var numEl    = document.getElementById('num');
    var blocksEl = document.getElementById('blocks');
    var tagline  = document.getElementById('tagline');
    var progress = document.getElementById('progress');

    /* build 25 blocks */
    var blks = [];
    for (var i = 0; i < 25; i++) {
      var b = document.createElement('div');
      b.className = 'blk';
      blocksEl.appendChild(b);
      blks.push(b);
    }

    /* timeline:
       0.0s  eyebrow + "25" + blocks fade in
       1.4s  count-down 25 -> 3.75 while blocks collapse (1.3s)
       2.9s  number settles teal, kept blocks glow, tagline fades in
       3.4s  progress bar starts (3.2s)
       6.8s  auto-advance                                            */

    var COUNT_START = 1400, COUNT_DUR = 1300;

    setTimeout(function () {
      var t0 = null;
      function ease(t) { return 1 - Math.pow(1 - t, 3); }

      function step(ts) {
        if (!t0) t0 = ts;
        var p = Math.min((ts - t0) / COUNT_DUR, 1);
        var e = ease(p);
        var val = 25 - (25 - 3.75) * e;
        numEl.textContent = val >= 10 ? val.toFixed(1) : val.toFixed(2);

        /* collapse blocks in sync: blocks 24..4 disappear as value drops */
        var keep = val / 1;               /* value == blocks kept */
        blks.forEach(function (b, i) {
          if (i + 1 > Math.ceil(keep)) b.classList.add('gone');
        });

        if (p < 1) { requestAnimationFrame(step); }
        else {
          numEl.textContent = '3.75';
          numEl.classList.add('settled');
          blks.forEach(function (b, i) {
            if (i < 3) b.classList.add('kept');
            else if (i === 3) { b.classList.add('kept', 'partial'); }
            else b.classList.add('gone');
          });
          tagline.classList.add('show');

          /* auto-advance only inside the player */
          if (window !== window.top) {
            setTimeout(function () {
              progress.classList.add('run');
            }, 500);
            setTimeout(function () {
              window.parent.postMessage({ type: 'keydown', key: 'ArrowRight' }, '*');
            }, 4200);
          }
        }
      }
      requestAnimationFrame(step);
    }, COUNT_START);
  })();
  </script>

    <div class="std-footer-tag">The Search AI Company</div>
